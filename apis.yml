description: >-
  Four independent data-collection REST APIs run from Paris — Places (local businesses), Jobs (job postings), Captions
  (video transcripts), and Verify (email verification). Each response reports a per-field fill-rate/completeness
  percentage, and calls returning no result are never billed.
