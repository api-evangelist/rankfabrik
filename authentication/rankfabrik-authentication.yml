note: >-
  Derived by hand from the developer documentation because RankFabrik publishes no
  machine-readable OpenAPI (specs are provided on request by email / via Apify
  marketplaces). All four products use a single scheme: a product-scoped API key
  passed in the x-cle-api request header. Keys are prefixed rf_ and are not
  interchangeable across products (a Places key cannot call Jobs). A missing or
  unknown key returns 401. Verified live: an unauthenticated GET returns
  HTTP 401 with body {"error":"clé absente — la présenter dans l'en-tête x-cle-api"}.
